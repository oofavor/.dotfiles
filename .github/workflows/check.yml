name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Lint
        run: |
          nix run nixpkgs#statix -- check .
          nix run nixpkgs#deadnix -- --fail .
      - name: Evaluate wawa config
        run: nix eval .#nixosConfigurations.wawa.config.system.build.toplevel.outPath
